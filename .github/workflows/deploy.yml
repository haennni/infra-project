name: Deploy
on:
  push:
    branches:
      - main

jobs:
  Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Github Repository에 올린 파일들을 불러오기
        uses: actions/checkout@v4

      - name: Github Repository 불러왔는 지 Test
        run: |
          ls 
          pwd

      - name: Github Actions에 JDK 17버전 설치하기
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: application.yml 파일 만들기
        run: echo "${{ secrets.APPLICATION_PROPERTIES }}" > src/main/resources/application.yml

      - name: 테스트 및 빌드하기
        run: ./gradlew clean build

      - name: AWS Resource에 접근할 수 있게 AWS credentials 실행
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: ECR에 로그인하기
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker 이미지 생성
        run: docker build -t seohaen-server .

      - name: Docker 이미지에 Tag 붙이기
        run: docker tag seohaen-server ${{ steps.login-ecr.outputs.registry }}/seohaen-server:latest

      - name: ECR에 Docker 이미지 Push하기
        run: docker push ${{ steps.login-ecr.outputs.registry }}/seohaen-server:latest

      - name: SSH(원격 접속)로 EC2에 접속하기
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }} # IP 주소를 말함
          username: ${{ secrets.EC2_USERNAME }} # EC2를 연결할 때 사용자 이름
          key: ${{ secrets.EC2_PRIVATE_KEY }} # EC2에 접근할 때 사용하는 키 페어
          script_stop: true
          script: |
            docker stop seohaen-server || true
            docker rm seohaen-server || true
            docker pull ${{ steps.login-ecr.outputs.registry }}/seohaen-server:latest
            docker run -d --name seohaen-server -p 8080:8080 ${{ steps.login-ecr.outputs.registry }}/seohaen-server:latest